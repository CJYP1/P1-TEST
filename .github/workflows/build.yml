# 构建并部署到 GitHub Pages
# 每次 push 到 main: 校验 CSV → 重新生成 bundle → 直接部署到 Pages。
# 关键: workflow 级 concurrency + cancel-in-progress=true ——
#   新的一次部署会自动取消还在排队/进行中的旧部署, 永远不会堆队卡住。
# 注意: 不再回推生成文件(之前那个 auto-build 提交会二次触发部署, 是卡队的根源)。
#   → 仓库 Settings → Pages → Source 需设为 "GitHub Actions"。
name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留最新一次部署, 旧的自动取消(不再一个个排队)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 统一 zone-activity 日期格式(YYYY-MM-DD, 修正 Excel 导出的日期)
        run: python tools/normalize_dates.py
      - name: 校验并导入工作安排 CSV → zp-data.global.js
        run: python tools/work_csv.py import
      - name: 重新生成注入 bundle(应用逻辑/内嵌页面/分区对照)
        run: python tools/build.py
      - name: 重新生成 L1 标记清单
        run: python tools/mark_l1.py
      - uses: actions/configure-pages@v5
      - name: 打包站点(整个仓库根目录作为静态站点)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
